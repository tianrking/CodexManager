<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Multi-Account Isolation Manager</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 data-i18n="appTitle">Codex Multi-Account Manager</h1>
          <p class="subtitle" data-i18n="appSubtitle">Cross-Platform (macOS / Win / Linux) · Zero Session Overwrite · Native Agent Unrestricted</p>
        </div>
      </div>

      <div class="actions-header">
        <!-- Search Box -->
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" data-i18n-ph="searchPlaceholder" placeholder="Search Profile..." />
        </div>

        <!-- Language Selector (i18n) -->
        <div class="lang-selector">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="zh">简体中文</option>
            <option value="es">Español</option>
          </select>
        </div>

        <!-- Appearance: theme + accent -->
        <div class="popover-wrap">
          <button id="appearanceBtn" class="btn btn-secondary btn-icon" data-i18n-title="appearanceLabel" title="Appearance" aria-label="Appearance">
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          </button>
          <div id="appearancePopover" class="popover hidden" role="dialog" aria-label="Appearance">
            <div class="popover-section">
              <div class="popover-label" data-i18n="appearanceTheme">Theme</div>
              <div class="theme-swatches" id="themeSwatches">
                <button class="theme-swatch" data-theme="slate" title="Slate" style="--s1:#0d0d0f;--s2:#17171a"></button>
                <button class="theme-swatch" data-theme="graphite" title="Graphite" style="--s1:#100f0d;--s2:#1d1a17"></button>
                <button class="theme-swatch" data-theme="midnight" title="Midnight" style="--s1:#0a0e16;--s2:#141a2a"></button>
                <button class="theme-swatch" data-theme="oled" title="OLED Black" style="--s1:#000000;--s2:#101010"></button>
                <button class="theme-swatch" data-theme="daylight" title="Daylight" style="--s1:#f4f4f6;--s2:#ffffff"></button>
              </div>
            </div>
            <div class="popover-section">
              <div class="popover-label" data-i18n="appearanceAccent">Accent</div>
              <div class="accent-row">
                <input type="color" id="accentPicker" value="#6e8ef2" aria-label="Accent color" />
                <span class="accent-hint" id="accentHex">#6e8ef2</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Status Badge -->
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span id="runningCountText">0 Online</span>
        </div>

        <button id="stopAllBtn" class="btn btn-danger-outline hidden">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
          <span data-i18n="stopAll">Stop All</span>
        </button>

        <button id="addProfileBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span data-i18n="addProfile">Add Profile</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content-area">
      <div id="profileGrid" class="profile-grid">
        <!-- Profile Cards Rendered Dynamically -->
      </div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="7.5" r="0.6" fill="currentColor" stroke="none"/></svg>
        </div>
        <h3 id="emptyTitle" data-i18n="noProfilesTitle">No Codex Isolated Profiles</h3>
        <p id="emptyDesc" data-i18n="noProfilesDesc">Click 'Add Profile' above to create a physically isolated Auth environment.</p>
      </div>
    </main>

    <!-- Modal Dialog -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modalTitle" data-i18n="modalAddTitle">Add Codex Isolated Profile</h2>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <form id="profileForm">
          <input type="hidden" id="editProfileId" />
          
          <div class="form-group">
            <label for="profileName"><span data-i18n="labelProfileName">Profile Name</span> <span class="required">*</span></label>
            <input type="text" id="profileName" data-i18n-ph="namePlaceholder" placeholder="e.g., Work / Personal / Client-A" required />
          </div>

          <div class="form-group">
            <label for="profileNote" data-i18n="labelNote">Description (Optional)</label>
            <input type="text" id="profileNote" data-i18n-ph="notePlaceholder" placeholder="e.g., Main work account, sufficient quota" />
          </div>

          <div class="form-group">
            <label for="projectPath" data-i18n="labelProjectPath">Default Project Path (Optional)</label>
            <div class="input-with-btn">
              <input type="text" id="projectPath" data-i18n-ph="pathPlaceholder" placeholder="e.g., /Users/username/Developer/project" />
              <button type="button" id="browsePathBtn" class="btn btn-secondary" data-i18n="btnBrowse">Browse...</button>
            </div>
          </div>

          <div class="form-group">
            <label data-i18n="labelBadgeColor">Badge Color</label>
            <div class="color-picker" id="colorPicker">
              <div class="color-option active" data-color="#007AFF" style="background-color: #007AFF;"></div>
              <div class="color-option" data-color="#34C759" style="background-color: #34C759;"></div>
              <div class="color-option" data-color="#FF9500" style="background-color: #FF9500;"></div>
              <div class="color-option" data-color="#AF52DE" style="background-color: #AF52DE;"></div>
              <div class="color-option" data-color="#FF2D55" style="background-color: #FF2D55;"></div>
              <div class="color-option" data-color="#5AC8FA" style="background-color: #5AC8FA;"></div>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancelModalBtn" class="btn btn-secondary" data-i18n="btnCancel">Cancel</button>
            <button type="submit" class="btn btn-primary" data-i18n="btnSave">Save Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
