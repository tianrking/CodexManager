<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodexManager Tray</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    /* 仅作用于本 popover 文档（不泄漏到主窗口） */
    html, body { height: auto; }
    body {
      background: transparent;
      overflow: hidden;
      padding: 0;
    }
    .pop {
      margin: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      box-shadow: 0 18px 50px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 20px);
      overflow: hidden;
      user-select: none;
    }
    .pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .pop-brand {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .pop-brand .pop-logo {
      width: 18px; height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #5b6cf2, #8a7cf2);
    }
    .pop-count {
      font-size: 0.72rem;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 100px;
      font-variant-numeric: tabular-nums;
    }
    .pop-list {
      padding: 6px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .pop-list::-webkit-scrollbar { width: 8px; }
    .pop-list::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 100px; }
    .pop-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 10px;
      transition: background 0.15s var(--ease);
    }
    .pop-row:hover { background: var(--surface); }
    .pop-avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 600;
      flex-shrink: 0;
    }
    .pop-meta { min-width: 0; flex: 1; }
    .pop-name {
      font-size: 0.84rem; font-weight: 500; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pop-status {
      font-size: 0.7rem; margin-top: 1px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .pop-status.on { color: var(--green); }
    .pop-status.off { color: var(--text-mute); }
    .pop-act {
      padding: 5px 10px !important;
      font-size: 0.74rem !important;
      flex-shrink: 0;
    }
    .pop-empty {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-mute);
      font-size: 0.82rem;
    }
    .pop-foot {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid var(--border);
    }
    .pop-foot .btn { flex: 1; padding: 6px 8px !important; font-size: 0.76rem !important; }
    .pop-danger:hover { color: var(--red); background: var(--red-dim); border-color: rgba(248,113,113,0.3); }
  </style>
</head>
<body>
  <div class="pop">
    <header class="pop-head">
      <span class="pop-brand"><span class="pop-logo"></span>CodexManager</span>
      <span class="pop-count" id="onlineCount">0 online</span>
    </header>
    <div class="pop-list" id="popList"></div>
    <footer class="pop-foot">
      <button class="btn btn-secondary" id="openMainBtn">Open</button>
      <button class="btn btn-secondary" id="stopAllBtn">Stop All</button>
      <button class="btn btn-secondary pop-danger" id="quitBtn">Quit</button>
    </footer>
  </div>
  <script type="module" src="./src/popover.js"></script>
</body>
</html>
